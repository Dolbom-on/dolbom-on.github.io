<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동물 달리기 경주 · 돌봄놀이터 온(ON)</title>
<link rel="stylesheet" href="../../common/engine.css">
</head>
<body>
<script type="module">
import { start, clamp } from '../../common/engine.js';
import { makeScene, drawKid } from '../../common/scene.js';

const scene = makeScene();
const S = { dist: 0, cheetah: 0, steps: 0, speed: 0, puddles: [], stepTimes: [], splash: -9, done: false, finishT: 0, jumpT: -9 };
const knee = { L: { up: false, last: -9 }, R: { up: false, last: -9 }, lastAny: -9, lastSide: null };
const GY = (api) => api.H * 0.76, KID = (api) => api.H * 0.28;
const PX_PER_M = (api) => api.W / 30;

function step(api, side, t) {
  S.steps++; S.stepTimes.push(t);
  knee.lastAny = t; knee.lastSide = side; knee[side].last = t;
  api.beep(side === 'L' ? 600 : 700, 0.05, 'triangle', 0.05);
}

start({
  id: 'animal-race', cat: 'run', view: 'scene', emoji: '🐆', title: '동물 달리기 경주',
  desc: '제자리에서 무릎을 높이 들고 뛰면 내 캐릭터가 달려요. 치타보다 먼저 결승선에 들어가 봐요!',
  how: ['제자리에서 무릎을 번갈아 높이 들며 뛰어요.', '빨리 뛸수록 캐릭터가 빨라져요.', '물웅덩이가 나오면 점프해서 넘어요. (중·상)'],
  tip: '무릎을 높이! 제자리에서 달려요!',
  place: '카메라에서 약 2.5~3m 떨어져, 무릎까지 꼭 보이게 서요.',
  images: ['kid_run1', 'kid_run2', 'kid_jump', 'kid_oops', 'kid_cheer', 'cheetah1', 'cheetah2', 'puddle', 'flag', 'tree', 'bush', 'cloud'],
  keys: '<b>R</b> 누르고 있으면 제자리 달리기 · <b>스페이스</b> 점프',
  need: [25, 26], needMsg: '무릎까지 화면에 보이게 조금 뒤로 가 주세요',
  hud: [['dist', '내 거리', 'm'], ['steps', '걸음', '번']],
  duration: 70,
  levels: {
    easy: { name: '하', sub: '처음 해요', length: 100, cheetah: 1.8, puddles: 0 },
    mid:  { name: '중', sub: '익숙해요', length: 130, cheetah: 2.3, puddles: 4 },
    hard: { name: '상', sub: '도전해요', length: 160, cheetah: 2.8, puddles: 6 },
  },
  init(api, t) {
    window.__S = S;
    const L = api.L;
    Object.assign(S, { dist: 0, cheetah: 0, steps: 0, speed: 0, stepTimes: [], splash: -9, done: false, finishT: 0, startT: t, win: null, jumpT: -9, jumpsOk: 0, cheetahDone: false,
      puddles: Array.from({ length: L.puddles }, (_, i) => ({ at: L.length * (i + 1) / (L.puddles + 1), hit: false, judged: false })) });
    knee.L.up = knee.R.up = false;
  },
  onJump(api, t) { if (api.mode === 'play') S.jumpT = t; },
  update(api, t, dt) {
    const L = api.L, lm = api.lm, b = api.base;
    // 무릎 들기 감지: 같은 쪽 골반보다 0.35T 안쪽으로 올라오고, 반대 무릎보다 0.15T 높을 때
    if (lm && !S.done) {
      for (const [side, ki, hi, oi] of [['L', 25, 23, 26], ['R', 26, 24, 25]]) {
        if ((lm[ki].v ?? 1) < 0.5) continue;
        const rel = (lm[ki].y - lm[hi].y) / b.T, higher = (lm[oi].y - lm[ki].y) / b.T;
        const k = knee[side];
        if (!k.up && rel < 0.38 && higher > 0.15) {
          k.up = true;
          const okGap = t - knee.lastAny > 0.18 && t - k.last > 0.35;
          if (okGap) step(api, side, t);
        } else if (k.up && rel > 0.55) k.up = false;
      }
    }
    // 속도: 최근 3초 걸음 수
    S.stepTimes = S.stepTimes.filter(s => t - s < 3);
    const rate = S.stepTimes.length / 3;                 // 걸음/초
    let target = clamp(rate * 1.6, 0, 6);                // m/s
    if (t - S.splash < 1) target *= 0.5;
    S.speed += (target - S.speed) * (1 - Math.exp(-dt / 0.4));
    if (!S.done) {
      S.dist += S.speed * dt;
      S.cheetah += L.cheetah * dt * clamp((t - S.startT) / 2, 0, 1);
      for (const p of S.puddles) if (!p.judged && S.dist >= p.at) {
        p.judged = true;
        if (t - S.jumpT < 0.6 || api.jumping) { S.jumpsOk++; api.pop('점프 성공!', api.W * 0.3, GY(api) - KID(api) * 1.2); api.beep(880, 0.1); }
        else { p.hit = true; S.splash = t; api.pop('첨벙!', api.W * 0.3, GY(api) - KID(api) * 1.2, '#3A7BEB'); api.beep(220, 0.15, 'sine', 0.08); }
      }
      if (S.dist >= L.length || S.cheetah >= L.length) {
        if (S.dist >= L.length) { S.done = true; S.finishT = t; S.win = S.cheetah < L.length; api.pop(S.win ? '1등! 치타를 이겼어요!' : '결승선 도착!', api.W / 2, api.H * 0.3, '#F26B4F', 0.07); api.beep(1046, 0.3); api.finish(); }
        else if (!S.cheetahDone) { S.cheetahDone = true; api.pop('치타가 먼저 도착! 끝까지 달려요!', api.W / 2, api.H * 0.25, '#5B6170', 0.05); }
      }
    }
    scene.scroll(S.speed * PX_PER_M(api) * dt);
    api.hud('dist', Math.floor(S.dist)); api.hud('steps', S.steps);
  },
  draw(api, ctx, t) {
    const gy = GY(api), W = api.W, H = api.H, L = api.L, px = PX_PER_M(api), kx = W * 0.3;
    scene.draw(api, ctx, gy);
    const playing = api.mode === 'play' || api.mode === 'countdown';
    // 물웅덩이 · 결승선
    for (const p of S.puddles || []) { const x = kx + (p.at - S.dist) * px; if (x > -200 && x < W + 200) api.drawImg('puddle', x, gy + H * 0.01, H * 0.2); }
    const fx = kx + ((L?.length || 100) - S.dist) * px;
    if (fx < W + 200) api.drawImg('flag', fx, gy - H * 0.12, H * 0.16);
    // 치타
    const cxp = kx + (S.cheetah - S.dist) * px + W * 0.06;
    const chName = playing && Math.floor(t / 0.14) % 2 ? 'cheetah2' : 'cheetah1';
    if (cxp > -100 && cxp < W + 100) api.drawImg(chName, cxp, gy - H * 0.07, H * 0.2);
    else if (playing) api.text(cxp > W ? '치타 ▶' : '◀ 치타', cxp > W ? W - 80 : 80, gy - H * 0.1, H * 0.035, '#C27C1E');
    // 아이
    const jt = t - S.jumpT, jh = jt >= 0 && jt < 0.6 ? 4 * (jt / 0.6) * (1 - jt / 0.6) * H * 0.12 : 0;
    const pose = t - S.splash < 0.5 ? 'oops' : jh > 2 ? 'jump' : S.done ? 'cheer' : 'run';
    drawKid(api, ctx, kx, gy - jh, KID(api), pose, t * (0.6 + S.speed / 4), S.speed > 0.3, gy);
    // 위쪽 진행 막대
    if (playing && L) {
      const x0 = W * 0.25, x1 = W * 0.75, y = H * 0.16;
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.strokeStyle = '#F7C9BC'; ctx.lineWidth = 8; ctx.stroke();
      const dot = (d, c, label) => { const x = x0 + (x1 - x0) * clamp(d / L.length, 0, 1); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fill(); api.text(label, x, y - 26, H * 0.026, c); };
      dot(S.cheetah, '#E0A030', '치타'); dot(S.dist, '#3A7BEB', '나');
      api.text('🏁', x1 + 24, y, H * 0.035);
    }
  },
  result(api) {
    const secs = S.finishT ? (S.finishT - S.startT).toFixed(1) : null;
    return { stats: [[Math.floor(S.dist) + 'm', '달린 거리'], [S.steps, '무릎 들기 걸음'], [secs ? secs + '초' : '—', '결승 기록']],
      msg: S.done ? (S.win ? '치타보다 먼저 들어왔어요! 🐆' : '끝까지 달렸어요!') : '조금만 더 빨리 무릎을 들면 결승선에 닿을 수 있어요.' };
  },
});
</script>
</body>
</html>
