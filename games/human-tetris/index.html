<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인간 테트리스 · 돌봄놀이터 온(ON)</title>
<link rel="stylesheet" href="../../common/engine.css">
</head>
<body>
<script type="module">
import { start, pick, buildBody, mid, puppetHeadRadius } from '../../common/engine.js';

// 자세 (팔: 위팔·아래팔 각도, 0=아래 90=옆 180=위)
const POSES = {
  up:       { name: '만세',       la1: 165, la2: 172, ra1: 165, ra2: 172 },
  T:        { name: 'T자',        la1: 90, la2: 90, ra1: 90, ra2: 90 },
  Y:        { name: 'Y자',        la1: 138, la2: 140, ra1: 138, ra2: 140 },
  squat:    { name: '앉아서 T자',  la1: 90, la2: 90, ra1: 90, ra2: 90, squat: 1 },
  star:     { name: '별',         la1: 125, la2: 125, ra1: 125, ra2: 125, ll: 24, rl: 24 },
  Lshape:   { name: 'ㄴ자 팔',     la1: 165, la2: 172, ra1: 90, ra2: 90 },
  bolt:     { name: '번개',        la1: 140, la2: 140, ra1: 40, ra2: 40 },
  flamingo: { name: '한 발 서기',   la1: 90, la2: 90, ra1: 90, ra2: 90, raise: 'R' },
  Lshape2:  { name: '반대 ㄴ자 팔', la1: 90, la2: 90, ra1: 165, ra2: 172 },
};
const KEYS = Object.keys(POSES);
const BONES = [['L', 11, 13], ['L', 13, 15], ['R', 12, 14], ['R', 14, 16], ['L', 23, 25], ['L', 25, 27], ['R', 24, 26], ['R', 26, 28]];
const S = { walls: [], pass: 0, fail: 0, next: 0, hist: [[], []], lastKey: null, okNow: [false, false], boneOk: [[], []], count: 0, snap: [0, 0], hold: [false, false], okFor: [0, 0], badFor: [0, 0] };

// 지금 자세가 목표와 맞는지 (b = 그 사람의 기준 몸 크기). boneOk 에 팔다리별 결과를 담음
function judge(api, lm, def, b, boneOk) {
  const tgt = buildBody(def);
  const cos = [];
  boneOk.length = 0;
  let hidden = false;
  BONES.forEach(([side, a, c], i) => {
    const leg = i >= 4;
    if (leg && (def.squat || (def.raise && ((def.raise === 'L' && i < 6) || (def.raise === 'R' && i >= 6))))) { boneOk.push(null); return; }
    if ((lm[a].v ?? 1) < 0.5 || (lm[c].v ?? 1) < 0.5) { hidden = true; boneOk.push(null); return; }   // 필요한 팔다리가 안 보이면 통과 못 함
    const px = lm[c].x - lm[a].x, py = lm[c].y - lm[a].y, pl = Math.hypot(px, py);
    if (pl < 0.15 * b.T) { boneOk.push(null); return; }
    const tx = tgt[c].x - tgt[a].x, ty = tgt[c].y - tgt[a].y, tl = Math.hypot(tx, ty);
    const v = (px * tx + py * ty) / (pl * tl);
    cos.push({ v, key: !leg || def.ll || def.rl }); boneOk.push(v >= 0.8);
  });
  if (hidden || cos.length < 3) return false;
  if (def.raise && ((lm[27].v ?? 1) < 0.5 || (lm[28].v ?? 1) < 0.5)) return false;
  const mean = cos.reduce((s, c) => s + c.v, 0) / cos.length;
  const need = api.level === 'easy' ? 0.8 : 0.85;
  if (mean < need || cos.some(c => c.key && c.v < 0.7)) return false;
  if (def.squat && (mid(lm[23], lm[24]).y - b.hipY) / b.T < 0.25) return false;
  if (def.raise) { const up = def.raise === 'L' ? lm[27].y : lm[28].y, other = def.raise === 'L' ? lm[28].y : lm[27].y; if ((other - up) / b.T < 0.2) return false; }
  return true;
}

// 구멍 뚫린 벽 그림 (화면 크기). 사람마다 자기 자리에 구멍 하나씩
function makeWall(api, defs) {
  const W = api.W, H = api.H, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#D9CCF2'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3;
  const bh = H / 9;
  for (let r = 0; r < 10; r++) { g.beginPath(); g.moveTo(0, r * bh); g.lineTo(W, r * bh); g.stroke();
    for (let x = (r % 2) * bh; x < W; x += bh * 2) { g.beginPath(); g.moveTo(x, r * bh); g.lineTo(x, r * bh + bh); g.stroke(); } }
  g.globalCompositeOperation = 'destination-out';
  g.strokeStyle = g.fillStyle = '#000';     // fully opaque cutter (the brick lines left a 55% white stroke style -> holes were only half cut)
  let cx = 0, cy = 0;
  const poses = [];
  defs.forEach((def, k) => {
    const b = api.people[k].base, P = buildBody(Object.assign({}, def, { cx: b.cx, hipY: b.hipY, scale: b.T / 0.2 }));
    poses.push(P);       // the character snaps to exactly this pose when the child matches it
    const s = (i) => api.toScreen(P[i]), u = api.unit * (b.T / 0.2);
    // hole a little wider than the character's arms / legs / body so the snapped character fits inside
    g.lineCap = 'round'; g.lineJoin = 'round';
    [[11, 13, 15, 0.1], [12, 14, 16, 0.1], [23, 25, 27, 0.13], [24, 26, 28, 0.13]].forEach(([a, m, e, wd]) => { g.lineWidth = u * wd; g.beginPath(); g.moveTo(s(a).x, s(a).y); g.lineTo(s(m).x, s(m).y); g.lineTo(s(e).x, s(e).y); g.stroke(); });
    g.beginPath(); [11, 12, 24, 23].forEach((i, n) => n ? g.lineTo(s(i).x, s(i).y) : g.moveTo(s(i).x, s(i).y)); g.closePath(); g.fill(); g.lineWidth = u * 0.16; g.stroke();
    // head hole: same centre as the character's head, sized from this pose's shoulder width
    const Wpx = Math.hypot(s(12).x - s(11).x, s(12).y - s(11).y); g.beginPath(); g.arc(s(0).x, s(0).y - Wpx * 0.1, puppetHeadRadius(Wpx) * 1.25, 0, 7); g.fill();
    cx += s(0).x / defs.length; cy += (s(11).y + s(23).y) / 2 / defs.length;
  });
  g.globalCompositeOperation = 'source-over';
  g.strokeStyle = '#9C86D8'; g.lineWidth = 10; g.strokeRect(5, 5, W - 10, H - 10);
  return { canvas: c, cx, cy, poses };
}

// snapping: 0 = draw the child's own pose, 1 = draw the hole's pose. Turns on after 0.1 s of a correct pose, off after 0.25 s of a wrong one
function updateSnap(t, dt, N, w) {
  for (let k = 0; k < N; k++) {
    if (S.okNow[k]) { S.okFor[k] = (S.okFor[k] || 0) + dt; S.badFor[k] = 0; } else { S.badFor[k] = (S.badFor[k] || 0) + dt; S.okFor[k] = 0; }
    if (S.okFor[k] >= 0.1) S.hold[k] = true;
    if (S.badFor[k] >= 0.25) S.hold[k] = false;
    const keepAfterPass = w && w.done && w.each && w.each[k] && t - w.doneT < 0.5;
    const want = (w && !w.done && S.hold[k]) || keepAfterPass ? 1 : 0;
    S.snap[k] += Math.sign(want - S.snap[k]) * Math.min(Math.abs(want - S.snap[k]), dt / 0.2);
  }
}

const n = (api) => api.duo ? 2 : 1;

start({
  id: 'human-tetris', cat: 'team', view: 'camera', emoji: '🧱', title: '인간 테트리스', duo: true,
  desc: '벽이 가까워지면 벽에 뚫린 구멍 모양대로 몸을 맞춰 통과해요. 둘이 하면 두 사람이 모두 맞춰야 통과!',
  how: ['위에 나온 자세 이름과 벽 구멍 모양을 봐요.', '벽이 닿기 전에 같은 모양으로 몸을 만들어요.', '벽과 벽 사이에는 제자리에서 가볍게 뛰어요.'],
  tip: '벽 구멍과 같은 모양을 만들어요!',
  images: ['star'], bg: 'bg_tetris',
  keys: '<b>1~9</b> 자세 바꾸기 (1 만세 · 2 T · 3 Y · 4 앉아서 T · 5 별 · 6 ㄴ자 · 7 번개 · 8 한 발 · 9 반대 ㄴ자) · <b>0</b> 차렷 · 둘이: <b>Shift+숫자</b> = 오른쪽 친구',
  hud: [['pass', '통과'], ['wall', '벽']],
  levels: {
    easy: { name: '하', sub: '처음 해요', travel: 5.0, gap: 1.6, set: ['up', 'T', 'Y', 'squat'] },
    mid:  { name: '중', sub: '익숙해요', travel: 4.0, gap: 1.3, set: ['up', 'T', 'Y', 'squat', 'star', 'Lshape', 'bolt'] },
    hard: { name: '상', sub: '도전해요', travel: 3.2, gap: 1.0, set: KEYS },
  },
  onKey(api, e) {
    const m = /^Digit(\d)$/.exec(e.code); if (!m) return;
    const d = +m[1], target = e.shiftKey ? api.synth2 : api.synth;
    target.preset = d >= 1 && d <= 9 ? POSES[KEYS[d - 1]] : null;
  },
  smooth: true,     // one outline around the whole character (no seams at the joints)
  init(api, t) { window.__S = S; window.__POSES = POSES; Object.assign(S, { walls: [], pass: 0, fail: 0, next: t + 0.8, hist: [[], []], lastKey: null, okNow: [false, false], boneOk: [[], []], count: 0, snap: [0, 0], hold: [false, false], okFor: [0, 0], badFor: [0, 0] }); },
  // draw the character blended toward the hole's pose while the child holds the right pose
  displayPose(api, k, lm) {
    const w = S.walls[0], s = S.snap[k];
    if (!w || !w.img.poses || !w.img.poses[k] || s <= 0.001) return null;
    const P = w.img.poses[k], e = s * s * (3 - 2 * s);
    return lm.map((p, i) => ({ x: p.x + (P[i].x - p.x) * e, y: p.y + (P[i].y - p.y) * e, v: Math.max(p.v ?? 1, e > 0.5 ? 1 : 0) }));
  },
  update(api, t, dt) {
    const L = api.L, N = n(api), people = api.people;
    if (t >= S.next && !S.walls.some(w => !w.done) && api.timeLeft > L.travel + 0.2) {
      const keys = [];
      for (let k = 0; k < N; k++) { let key; do { key = pick(L.set); } while ((key === S.lastKey || keys.includes(key)) && L.set.length > 2); keys.push(key); }
      S.lastKey = keys[0]; S.count++;
      S.walls.push({ keys, defs: keys.map(k => POSES[k]), t0: t, arrive: t + L.travel, done: false, img: makeWall(api, keys.map(k => POSES[k])) });
    }
    const w = S.walls.find(w => !w.done);
    for (let k = 0; k < N; k++) {
      const lm = people[k].lm;
      S.okNow[k] = !!(w && lm && judge(api, lm, w.defs[k], people[k].base, S.boneOk[k]));
      S.hist[k].push({ t, ok: S.okNow[k] }); S.hist[k] = S.hist[k].filter(h => t - h.t < 0.6);
    }
    if (w && t >= w.arrive) {
      w.done = true; w.doneT = t;
      w.each = [];
      // 마지막 0.6초 안에서 0.3초 이상 '이어서' 자세를 유지했는지 (끊어 잡은 자세는 인정 안 함)
      for (let k = 0; k < N; k++) { let run = 0, best = 0; const h = S.hist[k]; for (let i = 1; i < h.length; i++) { run = h[i].ok && h[i - 1].ok ? run + (h[i].t - h[i - 1].t) : 0; best = Math.max(best, run); } w.each.push(best >= 0.3); }
      w.ok = w.each.every(Boolean);
      api.react(w.ok ? 'happy' : 'wow', 0.8);
      if (w.ok) { S.pass++; api.pop(N > 1 ? '둘 다 통과! 👏' : '통과! 👏', api.W / 2, api.H * 0.3, '#3A7BEB', 0.08); [659, 880].forEach((f, i) => api.beep(f, 0.15, 'triangle', 0.12, i * 0.1)); api.burst(api.W / 2, api.H * 0.45, '#FFD24D', 18); }
      else { S.fail++; api.pop(N > 1 ? (w.each[0] ? '오른쪽 친구가 아깝다!' : w.each[1] ? '왼쪽 친구가 아깝다!' : '아깝다! 다음 벽!') : '아깝다! 다음 벽!', api.W / 2, api.H * 0.3, '#7B5CC4', 0.06); api.beep(220, 0.2, 'sine', 0.08); }
      S.next = t + L.gap;
    }
    S.walls = S.walls.filter(w => !w.done || t - w.doneT < 0.5);
    updateSnap(t, dt, N, S.walls[0]);
    api.hud('pass', S.pass); api.hud('wall', S.count);
  },
  draw(api, ctx, t) {
    const W = api.W, H = api.H, N = n(api);
    if (api.mode !== 'play') return;
    const w = S.walls[0];
    if (w) {
      const p = Math.min(1, (t - w.t0) / (w.arrive - w.t0));
      let sc = 0.22 + 0.78 * p * p, alpha = 0.55 + 0.4 * p;
      if (w.done) { const a = (t - w.doneT) / 0.5; sc = 1 + a * 0.6; alpha = 0.9 * (1 - a); }
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.translate(w.img.cx, w.img.cy); ctx.scale(sc, sc); ctx.translate(-w.img.cx, -w.img.cy);
      ctx.drawImage(w.img.canvas, 0, 0); ctx.restore();
      if (!w.done) {
        const name = N > 1 ? w.keys.map(k => POSES[k].name).join('  ·  ') : POSES[w.keys[0]].name;
        api.text(name, W / 2, H * 0.1, H * 0.065, '#5B3FB0', 900);
        api.text((w.arrive - t).toFixed(1) + '초', W / 2, H * 0.18, H * 0.04, '#5B3FB0');
      }
    } else if (api.timeLeft > 1) api.text('제자리에서 가볍게 뛰어요!', W / 2, H * 0.12, H * 0.055, '#F26B4F', 900);
    // 맞게 뻗은 팔·다리 끝에 반짝이는 별
    if (w && !w.done) {
      const people = api.people;
      for (let k = 0; k < N; k++) {
        const lm = people[k].lm, ok = S.boneOk[k]; if (!lm) continue;
        [[1, 15], [3, 16], [5, 27], [7, 28]].forEach(([i, end]) => {
          if (ok[i] !== true || ok[i - 1] === false) return;   // 위·아래 마디가 모두 맞을 때만 별
          const s = api.toScreen(lm[end]); api.drawImg('star', s.x, s.y, api.unit * (0.06 + Math.sin(t * 8 + i) * 0.008), t * 2);
        });
        if (S.okNow[k] && N > 1) { const s = api.toScreen({ x: people[k].base.cx, y: people[k].base.noseY - 0.18 }); api.text('좋아요!', s.x, s.y, H * 0.04, '#1FA67A', 900); }
      }
      if (N === 1 && S.okNow[0]) api.text('좋아요! 그대로!', W / 2, H * 0.88, H * 0.05, '#1FA67A', 900);
    }
  },
  result(api) {
    const total = S.pass + S.fail;
    return { stats: [[S.pass, api.duo ? '둘이 함께 통과' : '통과한 벽'], [total, '만난 벽']], msg: total ? `벽 ${total}개 중 ${S.pass}개를 통과했어요.` : '' };
  },
});
</script>
</body>
</html>
