<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>술래 피하기 · 돌봄놀이터 온(ON)</title>
<link rel="stylesheet" href="../../common/engine.css">
</head>
<body>
<script type="module">
import { start, rand, pick, dist, mid, segDist, clamp, ASPECT, CHAR_IDS } from '../../common/engine.js';
import { drawCharSprite, SPRITE_POSES } from '../../common/scene.js';

const S = { ghosts: [], dodged: 0, caught: 0, combo: 0, best: 0, inv: -9, next: 0, px: null, vx: 0, face: 1 };

// The child is shown as a whole-body illustration (front view) standing where the child stands.
// SCALE: sprite height relative to the child's real body height. Ghost hits are judged against this sprite, not the real body.
const SCALE = 0.5;
function kidBox(api) {             // in camera units: x, feet (bottom), top, h
  const b = api.base, lm = api.lm;
  const hip = lm ? mid(lm[23], lm[24]) : { x: b.cx, y: b.hipY };
  const ground = (b.ankL + b.ankR) / 2 + 0.01, lift = Math.max(0, b.hipY - hip.y);
  const h = (ground - b.noseY + b.T * 0.5) * SCALE, feet = ground - lift;
  return { x: hip.x, feet, ground, top: feet - h, h };
}
function drawKid(api, ctx, t) {
  const b = api.base; if (!b || !b.ok) return;
  const k = kidBox(api), feet = api.toScreen({ x: k.x, y: k.feet }), shadow = api.toScreen({ x: k.x, y: k.ground });
  const pose = t - S.inv < 0.8 ? 'foops' : Math.abs(S.vx) > 0.25 ? 'fstep' : 'fstand';
  drawCharSprite(api, ctx, pose, feet.x, feet.y, k.h * api.unit, pose === 'fstep' && S.face < 0, shadow.y);
}

start({
  id: 'tag-dodge', cat: 'run', view: 'camera', emoji: '👻', title: '술래 피하기',
  desc: '위에서 유령 술래가 내 쪽으로 내려와요. 옆으로 재빨리 움직여 피해요!',
  how: ['화면 가운데에 서요.', '유령이 내 머리 위로 오면 옆으로 크게 한 걸음 움직여요.', '유령이 지나가면 다시 가운데로 와요.'],
  tip: '유령이 오면 옆으로 쓱!',
  images: ['ghost1', 'ghost2', 'star', ...CHAR_IDS.flatMap(c => SPRITE_POSES.slice(0, 3).map(p => `${c}_${p}`))], bg: 'bg_tag',
  puppet: false, chars: true,
  keys: '<b>← →</b> 옆으로 움직이기',
  hud: [['dodged', '피한 유령'], ['combo', '연속']],
  levels: {
    easy: { name: '하', sub: '처음 해요', fall: 2.8, lock: 1.0, every: [2.2, 2.8], max: 1 },
    mid:  { name: '중', sub: '익숙해요', fall: 2.2, lock: 0.8, every: [1.4, 1.9], max: 2 },
    hard: { name: '상', sub: '도전해요', fall: 1.7, lock: 0.6, every: [0.9, 1.3], max: 3 },
  },
  init(api, t) { window.__S = S; Object.assign(S, { ghosts: [], dodged: 0, caught: 0, combo: 0, best: 0, inv: -9, next: t + 1, px: null, vx: 0, face: 1 }); },
  update(api, t, dt) {
    const L = api.L, b = api.base, lm = api.lm;
    const bodyX = lm ? mid(lm[11], lm[12]).x : b.cx;
    // sideways speed (smoothed) -> side-step pose and its direction
    if (S.px !== null && dt > 0) { const v = (bodyX - S.px) / dt / Math.max(0.05, b.W); S.vx += (v - S.vx) * Math.min(1, dt / 0.12); if (Math.abs(S.vx) > 0.25) S.face = Math.sign(S.vx); }
    S.px = bodyX;
    // 새 유령: 지금 몸 위쪽에서 출발
    if (t >= S.next && S.ghosts.length < L.max && api.timeLeft > L.fall) {
      const x = clamp(bodyX + rand(-0.08, 0.08), 0.15, api.aspect - 0.15);
      S.ghosts.push({ x, y: -0.12, t0: t, img: pick(['ghost1', 'ghost2']), locked: false, touch: 0, done: false, wob: rand(0, 6) });
      S.next = t + rand(L.every[0], L.every[1]);
    }
    const kb = kidBox(api);
    const headY = kb.ground - kb.h + 0.1, hitY = kb.ground - kb.h * 0.1;   // ghost reaches the sprite's head ... passes its feet = dodged
    for (const g of S.ghosts) {
      if (g.done) continue;
      const p = (t - g.t0) / L.fall;                       // 0 → 1 이 골반 지점 도착
      g.y = -0.12 + (hitY + 0.12) * p;
      // 몸 쪽으로 천천히 따라가다가, 머리에 닿기 lock초 전부터는 길이 고정 (피할 시간 보장)
      const headP = (headY - 0.1 + 0.12) / (hitY + 0.12);   // 유령이 머리에 닿기 시작하는 진행도
      if (!g.locked && (headP - p) * L.fall > L.lock) g.x += (bodyX - g.x) * (1 - Math.exp(-dt / 0.9));
      else g.locked = true;
      // touching = ghost overlaps the character drawn on screen (vertical capsule through the sprite's head and body)
      if (lm && t - S.inv > 1) {
        const R = 0.045, top = { x: kb.x, y: kb.top + kb.h * 0.22 }, bot = { x: kb.x, y: kb.feet - kb.h * 0.2 };
        const touching = segDist(g, top, bot) < kb.h * 0.2 + R;
        g.touch = touching ? g.touch + dt : 0;
        if (g.touch >= 0.1) {
          g.done = true; g.caught = t; S.caught++; S.combo = 0; S.inv = t;
          const s = api.toScreen(g); api.pop('잡혔다!', s.x, s.y - 40, '#7B5CC4'); api.beep(200, 0.25, 'sawtooth', 0.05); api.react('wow', 0.8);
        }
      }
      if (!g.done && g.y > hitY + 0.02) {
        g.done = true; g.passed = t; S.dodged++; S.combo++; S.best = Math.max(S.best, S.combo);
        const s = api.toScreen(g); api.pop(S.combo >= 3 ? `${S.combo}연속!` : '피했다!', s.x, s.y - 40, '#F26B4F'); api.beep(880, 0.1); api.react('happy');
      }
    }
    S.ghosts = S.ghosts.filter(g => !g.done || t - (g.caught || g.passed) < 0.6);
    api.hud('dodged', S.dodged); api.hud('combo', S.combo);
  },
  drawBack(api, ctx, t) { if (api.mode === 'play' || api.mode === 'countdown') drawKid(api, ctx, t); },
  draw(api, ctx, t) {
    const u = api.unit;
    for (const g of S.ghosts) {
      const s = api.toScreen(g), age = g.caught ? t - g.caught : g.passed ? t - g.passed : 0;
      const alpha = g.done ? Math.max(0, 1 - age / 0.6) : 1;
      const wob = Math.sin(t * 4 + g.wob) * 0.12;
      if (!api.drawImg(g.img, s.x, s.y + (g.passed ? age * u * 0.3 : 0), u * 0.16 * (g.caught ? 1 + age : 1), wob, alpha)) {
        ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(s.x, s.y, u * 0.06, 0, 7); ctx.fill();
      }
      if (!g.done && g.locked) { ctx.strokeStyle = 'rgba(123,92,196,.35)'; ctx.setLineDash([8, 8]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(s.x, s.y + u * 0.08); ctx.lineTo(s.x, api.toScreen({ x: 0, y: kidBox(api).ground }).y); ctx.stroke(); ctx.setLineDash([]); }
    }
    if (t - S.inv < 1) api.text('잠깐 무적!', api.W / 2, api.H * 0.2, api.H * 0.04, '#7B5CC4');
  },
  result() {
    const total = S.dodged + S.caught;
    return { stats: [[S.dodged, '피한 유령'], [S.best, '최고 연속']], msg: total ? `유령 ${total}마리 중 ${S.dodged}마리를 피했어요.` : '' };
  },
});
</script>
</body>
</html>
