<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>터널 달리기 · 돌봄놀이터 온(ON)</title>
<link rel="stylesheet" href="../../common/engine.css">
</head>
<body>
<script type="module">
import { start, rand } from '../../common/engine.js';
import { makeScene, drawKid } from '../../common/scene.js';

const AIR = 0.72;
const scene = makeScene();
const S = { obs: [], jumpStart: -9, stumble: -9, pass: 0, hit: 0, moves: 0 };
const GY = (api) => api.H * 0.76, KID = (api) => api.H * 0.3, PEAK = (api) => api.H * 0.2;
const kidH = (api, t) => { const p = (t - S.jumpStart) / AIR; return p < 0 || p > 1 ? 0 : 4 * p * (1 - p) * PEAK(api); };

start({
  id: 'tunnel-run', cat: 'run', view: 'scene', emoji: '🏃', title: '터널 달리기',
  desc: '아래 바위는 점프로 넘고, 매달린 바위는 쪼그려 앉아 피해요.',
  how: ['바닥 바위가 오면 두 발로 점프해요.', '매달린 바위가 오면 무릎을 굽혀 쪼그려 앉아요.', '부딪히지 않고 많이 통과하면 좋아요.'],
  tip: '바위는 점프! 매달린 바위는 쪼그려 앉기!',
  images: ['kid_run1', 'kid_run2', 'kid_jump', 'kid_oops', 'kid_duck', 'rock_hang', 'rock_ground', 'tree', 'bush', 'cloud'],
  keys: '<b>스페이스</b> 점프 · <b>↓</b> 누르고 있으면 쪼그려 앉기',
  hud: [['pass', '통과'], ['moves', '점프·숙이기', '번']],
  levels: {
    easy: { name: '하', sub: '처음 해요', travel: 2.6, gap: [2.0, 2.6], block: 3, pair: 0 },
    mid:  { name: '중', sub: '익숙해요', travel: 2.1, gap: [1.5, 2.1], block: 1, pair: 0 },
    hard: { name: '상', sub: '도전해요', travel: 1.7, gap: [1.15, 1.6], block: 1, pair: 0.3, pairGap: 1.05 },
  },
  init(api, t) {
    window.__S = S;
    Object.assign(S, { obs: [], next: t + 1.2, pass: 0, hit: 0, moves: 0, jumpStart: -9, queued: false, stumble: -9, lastDuck: -9, blockLeft: 0, blockType: 'low', wasDuck: false });
  },
  onJump(api, t) {
    if (api.mode !== 'play') return;
    S.moves++;
    const p = (t - S.jumpStart) / AIR;
    if (p >= 1 || p < 0) { S.jumpStart = t; api.beep(520, 0.1, 'triangle', 0.08); } else if (p > 0.55) S.queued = true;
  },
  update(api, t, dt) {
    const L = api.L, W = api.W, R = api.H * 0.06;
    scene.scroll(dt * (W / L.travel) * 0.45);
    if (S.queued && (t - S.jumpStart) / AIR >= 1) { S.jumpStart = t; S.queued = false; }
    if (api.ducking) { S.lastDuck = t; if (!S.wasDuck) S.moves++; }
    S.wasDuck = api.ducking;
    // 장애물 만들기
    if (t >= S.next && api.timeLeft > L.travel + 0.3) {
      let type;
      if (L.block > 1) { if (S.blockLeft <= 0) { S.blockType = S.blockType === 'low' ? 'high' : 'low'; S.blockLeft = L.block; } type = S.blockType; S.blockLeft--; }
      else type = Math.random() < 0.5 ? 'low' : 'high';
      const n = Math.random() < L.pair ? 2 : 1;
      for (let i = 0; i < n; i++) S.obs.push({ type: i ? (type === 'low' ? 'high' : 'low') : type, arrive: t + L.travel + i * (L.pairGap || 1), judged: false });
      S.next = t + (n - 1) * (L.pairGap || 1) + rand(L.gap[0], L.gap[1]);
    }
    for (const o of S.obs) {
      if (o.judged || t < o.arrive - 0.03) continue;
      o.judged = true;
      const ok = o.type === 'low' ? kidH(api, t) > R * 0.9 : (api.ducking || t - S.lastDuck < 0.25);
      const x = W * 0.28, y = GY(api) - KID(api) * 1.1;
      if (ok) { S.pass++; api.pop(o.type === 'low' ? '점프 성공!' : '숙이기 성공!', x, y); api.beep(880, 0.12); }
      else { S.hit++; S.stumble = t; o.hit = t; api.pop('앗!', x, y, '#5B6170'); api.beep(180, 0.2, 'square', 0.06); }
    }
    S.obs = S.obs.filter(o => t - o.arrive < L.travel * 0.5);
    api.hud('pass', S.pass); api.hud('moves', S.moves);
  },
  draw(api, ctx, t) {
    const gy = GY(api), W = api.W, H = api.H, L = api.L, cx = W * 0.28, R = H * 0.06;
    scene.draw(api, ctx, gy);
    // 동굴 천장 띠
    ctx.fillStyle = '#E9DCD0'; ctx.fillRect(0, 0, W, H * 0.06);
    ctx.fillStyle = '#DCCBBB'; for (let x = -(scene.off % 120); x < W; x += 120) { ctx.beginPath(); ctx.ellipse(x + 60, H * 0.06, 70, 22, 0, 0, Math.PI); ctx.fill(); }
    if (api.mode === 'play' && S.obs) for (const o of S.obs) {
      const x = cx + (o.arrive - t) / L.travel * (W + R * 2 - cx);
      if (o.type === 'low') {
        const lift = o.hit ? Math.max(0, Math.sin(Math.min(1, (t - o.hit) / 0.4) * Math.PI)) * R : 0;
        api.drawImg('rock_ground', x, gy - R * 0.55 - lift, R * 2.6) || (ctx.fillStyle = '#AAA', ctx.beginPath(), ctx.arc(x, gy - R, R, 0, 7), ctx.fill());
      } else {
        const rockY = gy - KID(api) * 0.95;      // 바위 아래쪽 끝 = 서 있는 아이 머리 높이 근처
        const im = api.img('rock_hang'), w = R * 2.4;
        ctx.strokeStyle = '#B79C7E'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, H * 0.05); ctx.lineTo(x, rockY - w * 1.1); ctx.stroke();
        if (im) { const h = w * im.height / im.width; ctx.drawImage(im, x - w / 2, rockY - h, w, h); }
        else { ctx.fillStyle = '#AAA'; ctx.beginPath(); ctx.arc(x, rockY - R, R, 0, 7); ctx.fill(); }
      }
    }
    const h = api.mode === 'play' || api.mode === 'countdown' ? kidH(api, t) : 0;
    const moving = api.mode === 'play' || api.mode === 'countdown';
    const pose = t - S.stumble < 0.5 ? 'oops' : h > 2 ? 'jump' : api.ducking ? 'duck' : 'run';
    drawKid(api, ctx, cx, gy - h, KID(api), pose, t, moving, gy);
  },
  result(api) {
    const total = S.pass + S.hit;
    return { stats: [[S.pass, '통과한 장애물'], [S.moves, '점프·숙이기 횟수']], msg: total ? `장애물 ${total}개 중 ${S.pass}개를 통과했어요.` : '' };
  },
});
</script>
</body>
</html>
