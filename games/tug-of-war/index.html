<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 줄다리기 · 돌봄놀이터 온(ON)</title>
<link rel="stylesheet" href="../../common/engine.css">
</head>
<body>
<script type="module">
import { start, clamp } from '../../common/engine.js';
import { CROWD_IMAGES, drawTeams } from '../../common/crowd.js';

const ACTIONS = ['제자리 뛰기', '점핑잭', '무릎 높이 들기', '스쿼트'];
const S = { p: 0, d: 0, winL: 0, winR: 0, rest: -9, action: 0, actionAt: 0, lastWin: null };

start({
  id: 'tug-of-war', cat: 'team', view: 'camera', pose: false, energy: true, emoji: '🪢', title: '팀 줄다리기',
  desc: '화면 왼쪽 팀과 오른쪽 팀 중 더 열심히 움직인 쪽으로 줄이 당겨져요.',
  how: ['가운데 점선을 기준으로 두 팀이 같은 인원으로 나누어 서요.', '처음에 2초 가만히, 5초 신나게 움직여 팀별 움직임을 재요.', '시작하면 자기 자리에서 힘껏 뛰어요. 줄을 끝까지 당기면 1점!'],
  tip: '자기 자리에서 힘껏 뛰어요!',
  place: '두 팀이 카메라에서 같은 거리에, 가운데를 비우고 나누어 서요.',
  images: ['star', ...CROWD_IMAGES], bg: 'bg_tug', puppet: false,
  keys: '<b>A</b> 빠르게 누르기 = 왼쪽 팀 · <b>L</b> 빠르게 누르기 = 오른쪽 팀',
  hud: [['score', '왼쪽 : 오른쪽']],
  levels: {
    easy: { name: '하', sub: '처음 해요', duration: 45, speed: 0.22, actions: false },
    mid:  { name: '중', sub: '익숙해요', duration: 60, speed: 0.25, actions: true },
    hard: { name: '상', sub: '도전해요', duration: 75, speed: 0.3, actions: true },
  },
  init(api, t) { window.__S = S; Object.assign(S, { p: 0, d: 0, winL: 0, winR: 0, rest: -9, action: 0, actionAt: t, lastWin: null }); },
  update(api, t, dt) {
    const L = api.L, e = api.energy;
    if (t - S.rest > 2) {
      let D = 0;
      if (e.AL >= 0.1 || e.AR >= 0.1) D = (e.AL - e.AR) / (e.AL + e.AR + 0.2);
      S.d += (D - S.d) * (1 - Math.exp(-dt / 0.5));            // 0.5초 평활
      const dd = Math.abs(S.d) < 0.1 ? 0 : S.d;
      S.p = clamp(S.p - dd * L.speed * dt, -1, 1);              // 왼쪽 팀이 더 움직이면 줄이 왼쪽(-)으로
      if (Math.abs(S.p) >= 1) {
        const left = S.p < 0; left ? S.winL++ : S.winR++; S.lastWin = left ? 'L' : 'R'; S.rest = t; S.p = 0; S.d = 0;
        api.pop(left ? '왼쪽 팀 1점!' : '오른쪽 팀 1점!', api.W * (left ? 0.28 : 0.72), api.H * 0.3, left ? '#F26B4F' : '#3A7BEB', 0.07);
        [659, 784, 988].forEach((f, i) => api.beep(f, 0.15, 'triangle', 0.12, i * 0.1));
      }
    }
    if (L.actions && t - S.actionAt > 15) { S.action = (S.action + 1) % ACTIONS.length; S.actionAt = t; api.beep(740, 0.1); }
    api.hud('score', `${S.winL} : ${S.winR}`);
  },
  draw(api, ctx, t) {
    const W = api.W, H = api.H;
    // 가운데 점선
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 6; ctx.setLineDash([18, 14]);
    ctx.beginPath(); ctx.moveTo(W / 2, H * 0.1); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);
    api.text('왼쪽 팀', W * 0.25, H * 0.2, H * 0.05, '#F26B4F', 900);
    api.text('오른쪽 팀', W * 0.75, H * 0.2, H * 0.05, '#3A7BEB', 900);
    const playing = api.mode === 'play';
    const off = playing ? S.p * W * 0.32 : 0;
    const y = drawTeams(api, ctx, t, off * 0.18, playing ? api.energy.AL : 0.2, playing ? api.energy.AR : 0.2);   // 그림 속 두 팀
    if (!playing) return;
    // 밧줄
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#B98B5E'; ctx.lineWidth = H * 0.03; ctx.beginPath(); ctx.moveTo(W * 0.04, y); ctx.lineTo(W * 0.96, y); ctx.stroke();
    ctx.strokeStyle = '#E2C29A'; ctx.lineWidth = H * 0.018; ctx.stroke();
    for (let x = W * 0.05; x < W * 0.95; x += 26) { ctx.strokeStyle = '#C9A174'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + off % 26, y - H * 0.012); ctx.lineTo(x + 10 + off % 26, y + H * 0.012); ctx.stroke(); }
    // 승리선
    [W / 2 - W * 0.32, W / 2 + W * 0.32].forEach((x, i) => { ctx.fillStyle = i ? 'rgba(58,123,235,.85)' : 'rgba(242,107,79,.85)'; ctx.fillRect(x - 4, y - H * 0.09, 8, H * 0.18); });
    // 리본
    const rx = W / 2 + off;
    ctx.fillStyle = '#FF7A8A';
    ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(rx - H * 0.05, y - H * 0.04); ctx.lineTo(rx - H * 0.05, y + H * 0.04); ctx.fill();
    ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(rx + H * 0.05, y - H * 0.04); ctx.lineTo(rx + H * 0.05, y + H * 0.04); ctx.fill();
    ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(rx - H * 0.02, y + H * 0.1); ctx.lineTo(rx + H * 0.02, y + H * 0.1); ctx.fill();
    ctx.fillStyle = '#E25566'; ctx.beginPath(); ctx.arc(rx, y, H * 0.018, 0, 7); ctx.fill();
    // 팀 움직임 막대
    const bar = (x, v, c) => { const w = W * 0.3, h = H * 0.03, y = H * 0.26; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.roundRect(x - w / 2, y, w, h, h / 2); ctx.fill();
      ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x - w / 2, y, w * clamp(v, 0, 1), h, h / 2); ctx.fill(); };
    bar(W * 0.25, api.energy.AL, '#F26B4F'); bar(W * 0.75, api.energy.AR, '#3A7BEB');
    if (t - S.rest < 2) api.text('준비… 다시 시작!', W / 2, H * 0.75, H * 0.05, '#1F2430');
    if (api.L.actions) api.text(`지금 동작: ${ACTIONS[S.action]}`, W / 2, H * 0.86, H * 0.05, '#1F2430', 900);
  },
  result() {
    const msg = S.winL === S.winR ? '무승부! 두 팀 모두 최고예요!' : S.winL > S.winR ? '왼쪽 팀 승리! 오른쪽 팀도 잘했어요!' : '오른쪽 팀 승리! 왼쪽 팀도 잘했어요!';
    return { stats: [[S.winL, '왼쪽 팀'], [S.winR, '오른쪽 팀']], msg };
  },
});
</script>
</body>
</html>
