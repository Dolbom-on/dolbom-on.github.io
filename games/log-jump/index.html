<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통나무 점프 · 돌봄놀이터 온(ON)</title>
<link rel="stylesheet" href="../../common/engine.css">
</head>
<body>
<script type="module">
import { start, rand } from '../../common/engine.js';
import { makeScene, drawKid, eachHalf, viewFor, halfLabel } from '../../common/scene.js';

const AIR = 0.72;
// one state per friend (two friends = split screen, same logs for both)
const mk = () => ({ scene: makeScene(), logs: [], jumpStart: -9, queued: false, stumble: -9, score: 0, hits: 0, jumps: 0, combo: 0 });
const P = [mk(), mk()];
const G = { next: 0 };
const GY = (api) => api.H * 0.74, KID = (api) => api.H * 0.3, PEAK = (api) => api.H * 0.2, R = (api) => Math.max(22, api.H * 0.055);
const kidH = (api, S, t) => { const p = (t - S.jumpStart) / AIR; return p < 0 || p > 1 ? 0 : 4 * p * (1 - p) * PEAK(api); };
const WORDS = ['좋아요!', '멋져요!', '최고!', '훌륭해요!'];
const N = (api) => api.duo ? 2 : 1;

start({
  id: 'log-jump', cat: 'run', view: 'scene', emoji: '🪵', title: '통나무 점프', duo: true,
  desc: '굴러오는 통나무를 제자리에서 두 발로 점프해서 넘어요. 둘이 하면 화면이 반으로 나뉘어 같은 통나무를 함께 넘어요.',
  how: ['카메라에서 2.5~3m 떨어져 머리부터 무릎까지 보이게 서요. (둘이면 나란히)', '통나무가 아이 발 앞에 오기 조금 전에 두 발로 점프해요.', '부딪혀도 괜찮아요. 다음 통나무를 넘어요!'],
  tip: '통나무가 오면 두 발로 점프!',
  images: ['kid_run1', 'kid_run2', 'kid_jump', 'kid_oops', 'log', 'tree', 'bush', 'cloud'],
  keys: '<b>스페이스</b> 점프 · 둘이: 오른쪽 친구 <b>W</b> 점프',
  hud: [['score', '넘은 통나무'], ['jumps', '점프', '번']],
  levels: {
    easy: { name: '하', sub: '처음 해요', travel: 2.6, gap: [1.8, 2.4], double: 0, triple: 0, pairGap: 1.1 },
    mid:  { name: '중', sub: '익숙해요', travel: 2.1, gap: [1.4, 2.0], double: 0.3, triple: 0, pairGap: 1.05 },
    hard: { name: '상', sub: '도전해요', travel: 1.7, gap: [1.1, 1.6], double: 0.35, triple: 0.15, pairGap: 0.92 },
  },
  init(api, t) { window.__S = P[0]; window.__P = P; for (const S of P) Object.assign(S, mk(), { scene: S.scene }); G.next = t + 1.2; },
  onJump(api, t, k = 0) {
    const S = P[k]; if (!S) return;
    if (api.mode === 'play') S.jumps++;
    if (api.mode !== 'play' && api.mode !== 'countdown') return;
    const p = (t - S.jumpStart) / AIR;
    if (p >= 1 || p < 0) { S.jumpStart = t; S.queued = false; api.beep(k ? 620 : 520, 0.1, 'triangle', 0.08); } else if (p > 0.55) S.queued = true;
  },
  update(api, t, dt) {
    const L = api.L;
    // same logs for everybody
    if (t >= G.next && api.timeLeft > L.travel + 0.3) {
      const r = Math.random(), n = r < L.triple ? 3 : r < L.triple + L.double ? 2 : 1;
      for (let k = 0; k < N(api); k++) for (let i = 0; i < n; i++) P[k].logs.push({ arrive: t + L.travel + i * L.pairGap, judged: false, hit: 0 });
      G.next = t + (n - 1) * L.pairGap + rand(L.gap[0], L.gap[1]);
    }
    for (let k = 0; k < N(api); k++) {
      const S = P[k], v = viewFor(api, k), cx = v.W * 0.26;
      S.scene.scroll(dt * (v.W / L.travel) * 0.45);
      if (S.queued && (t - S.jumpStart) / AIR >= 1) { S.jumpStart = t; S.queued = false; }
      for (const g of S.logs) {
        if (g.judged || t < g.arrive - 0.03) continue;
        g.judged = true;
        const y = GY(v) - KID(v) - PEAK(v) * 0.6;
        if (kidH(v, S, t) > R(v) * 0.9) { S.score++; S.combo++; v.pop(S.combo >= 3 ? `${S.combo}연속! ${WORDS[S.combo % 4]}` : '+1', cx, y); api.beep(880, 0.12); }
        else { S.hits++; S.combo = 0; S.stumble = t; g.hit = t; v.pop('앗!', cx, y + PEAK(v) * 0.4, '#5B6170'); api.beep(180, 0.2, 'square', 0.06); }
      }
      S.logs = S.logs.filter(g => t - g.arrive < L.travel * 0.5);
    }
    if (api.duo) { api.hud('score', `${P[0].score} : ${P[1].score}`); api.hud('jumps', `${P[0].jumps} : ${P[1].jumps}`); }
    else { api.hud('score', P[0].score); api.hud('jumps', P[0].jumps); }
  },
  draw(api, ctx, t) {
    eachHalf(api, ctx, (v, k) => {
      const S = P[k], gy = GY(v), W = v.W, L = v.L, cx = W * 0.26, r = R(v), sx = W + r * 2;
      S.scene.draw(v, ctx, gy);
      if (v.mode === 'play') for (const g of S.logs) {
        const x = cx + (g.arrive - t) / L.travel * (sx - cx);
        const lift = g.hit ? Math.max(0, Math.sin(Math.min(1, (t - g.hit) / 0.4) * Math.PI)) * r * 1.2 : 0;
        ctx.fillStyle = 'rgba(80,110,60,.18)'; ctx.beginPath(); ctx.ellipse(x, gy + 4, r * 0.9, r * 0.2, 0, 0, 7); ctx.fill();
        if (!v.drawImg('log', x, gy - r - lift, r * 2, -x / r)) { ctx.fillStyle = '#C98B55'; ctx.beginPath(); ctx.arc(x, gy - r - lift, r, 0, 7); ctx.fill(); }
      }
      const moving = v.mode === 'play' || v.mode === 'countdown';
      const h = moving ? kidH(v, S, t) : 0;
      const pose = t - S.stumble < 0.5 ? 'oops' : h > 2 ? 'jump' : 'run';
      drawKid(v, ctx, cx, gy - h, KID(v), pose, t, moving, gy);
      halfLabel(v, `${k ? '오른쪽' : '왼쪽'} 친구 · ${S.score}개`);
    });
  },
  result(api) {
    if (api.duo) {
      const [a, b] = P;
      return { stats: [[a.score, '왼쪽 친구'], [b.score, '오른쪽 친구'], [a.score + b.score, '함께 넘은 통나무']], msg: '둘이 함께 통나무를 넘었어요! 🪵' };
    }
    const S = P[0], total = S.score + S.hits;
    return { stats: [[S.score, '넘은 통나무'], [S.jumps, '점프 횟수']], msg: total ? `통나무 ${total}개 중 ${S.score}개를 넘었어요.` : '' };
  },
});
</script>
</body>
</html>
